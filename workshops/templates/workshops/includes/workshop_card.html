<article class="card workshop-card mb-3">
    <div class="card-body">
        <h2 class="h5 card-title">
            <a href="{% url 'workshops:detail' workshop.id %}">{{ workshop.name|default:"Без названия" }}</a>
        </h2>
        <p class="card-text text-secondary">
            {{ workshop.date|date:"d.m.Y" }} · {{ workshop.price|floatformat:"2u" }} руб.
            · Свободных мест: {{ workshop.seats }}
        </p>
    </div>
</article>
